<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alcat Logos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400&display=swap">
<style>
*{box-sizing:border-box}body{margin:0}img{max-width:100%}
/* Layout: brand-kit index — header, download-all bar, responsive grid of logo cards on a neutral tile */
:root{
  --bg:#f3f4f6; --surface:#ffffff; --tile:#e9ebef; --fg:#16181d; --muted:#5d636e;
  --line:#d8dbe1; --accent:#16181d; --accent-fg:#ffffff;
  --display:"Space Grotesk",Inter,system-ui,sans-serif;
  --body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121418; --surface:#1b1e24; --tile:#f1f2f4; --fg:#eceef2; --muted:#9aa1ad;
  --line:#2c3038; --accent:#eceef2; --accent-fg:#121418; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121418; --surface:#1b1e24; --tile:#f1f2f4; --fg:#eceef2; --muted:#9aa1ad;
  --line:#2c3038; --accent:#eceef2; --accent-fg:#121418; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-block:40px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:28px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px}
.brand{display:flex;align-items:center;gap:22px;flex-wrap:wrap;min-width:0}
.mark{display:block;width:clamp(120px,18vw,170px);flex:none}
.mark img{display:block;width:100%;height:auto}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .mark{background:#dee8f1;border-radius:10px;padding:12px}}
:root[data-theme="dark"] .mark{background:#dee8f1;border-radius:10px;padding:12px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,4.5vw,40px);line-height:1.05;margin:0;text-wrap:balance}
.lede{color:var(--muted);margin:8px 0 0;max-width:60ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.art{background:var(--tile);aspect-ratio:16/9;display:grid;place-items:center;padding:24px;max-width:100%}
.art img{max-height:100%;width:100%;object-fit:contain}
.meta{padding:16px 18px 18px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
h2{font-family:var(--display);font-weight:500;font-size:19px;margin:0}
.spec{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.sw{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;color:var(--muted);
  border:1px solid var(--line);border-radius:999px;padding:2px 8px 2px 3px}
.sw i{width:14px;height:14px;border-radius:50%;display:block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
button{font:600 13px/1 var(--body);letter-spacing:.04em;cursor:pointer;border-radius:7px;padding:11px 10px;
  border:1px solid var(--line);background:var(--surface);color:var(--fg);transition:background .15s,border-color .15s}
button:hover{border-color:var(--fg)}
button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);padding:13px 18px}
button:disabled{opacity:.45;cursor:not-allowed}
.status{min-height:1.5em;font-size:13px;color:var(--muted);margin:0}
footer{font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="brand">
      <span class="mark"><img src="alcat-mark.png" alt="All Categories"></span>
      <div>
      <p class="eyebrow">Kit de marcas</p>
      <h1>Logos Alcat</h1>
      <p class="lede">Cinco logos oficiales en vector (SVG, PDF) y PNG transparente de 3000&nbsp;px de ancho. Elige el formato debajo de cada marca o baja el paquete completo.</p>
      </div>
    </div>
    <button class="primary" id="all">Descargar todo (ZIP)</button>
  </header>
  <p class="status" id="status" role="status" aria-live="polite"></p>
  <main class="grid" id="grid"></main>
  <footer>SVG y PDF escalan sin perder calidad (imprenta, rotulación). PNG para web, presentaciones y redes.</footer>
</div>

<script>
const LOGOS=[
  {id:"hh-hardware",name:"Hard Head",png:"3000 × 1170",colors:["#FEBE10","#231F20","#A7A9AC"]},
  {id:"magic-garden",name:"Magic Garden",png:"3000 × 1000",colors:["#22B14B","#F27C21"]},
  {id:"victory-hardware",name:"Victory Hardware",png:"3000 × 1000",colors:["#DC2927","#0A0707"]},
  {id:"sky-paints",name:"Sky Paints",png:"3000 × 1186",colors:["#1B7BBD","#3F4F52","#FCE82B"]},
  {id:"plumb-pro",name:"PlumbPro",png:"3000 × 1688",colors:["#202C58","#29ACD9"]},
];
const grid=document.getElementById("grid"), statusEl=document.getElementById("status");
for(const l of LOGOS){
  const c=document.createElement("article");c.className="card";
  c.innerHTML=`<div class="art"><img src="svg/${l.id}.svg" alt="Logo ${l.name}"></div>
  <div class="meta"><div class="row"><h2></h2><span class="spec">PNG ${l.png} px</span></div>
  <div class="swatches">${l.colors.map(h=>`<span class="sw"><i style="background:${h}"></i>${h}</span>`).join("")}</div>
  <div class="btns">${["svg","png","pdf"].map(f=>`<button data-file="${f}/${l.id}.${f}" aria-label="Descargar ${l.name} en ${f.toUpperCase()}">${f.toUpperCase()}</button>`).join("")}</div></div>`;
  c.querySelector("h2").textContent=l.name;
  grid.appendChild(c);
}
document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b)return;
  const p=b.id==="all"?"alcat-logos.zip":b.dataset.file; if(!p)return;
  const a=document.createElement("a");a.href=p;a.download=p.split("/").pop();document.body.appendChild(a);a.click();a.remove();
});
</script>

</body>
</html>
